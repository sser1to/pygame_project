<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- shadow -->
  <rect x="3" y="13" width="10" height="2" fill="#000000" opacity="0.18"/>
  <!-- body (torso) -->
  <rect x="4" y="5" width="8" height="7" fill="#ffffff"/>
  <rect x="4" y="5" width="8" height="1" fill="#cccccc"/>
  <!-- body outline -->
  <rect x="3" y="5" width="1" height="7" fill="#333333"/>
  <rect x="12" y="5" width="1" height="7" fill="#333333"/>
  <rect x="4" y="12" width="8" height="1" fill="#333333"/>
  <!-- left arm (close to body, symmetric) -->
  <rect x="2" y="6" width="2" height="5" fill="#ffffff"/>
  <rect x="1" y="6" width="1" height="5" fill="#333333"/>
  <rect x="2" y="11" width="2" height="1" fill="#333333"/>
  <rect x="2" y="5" width="2" height="1" fill="#333333"/>
  <!-- right arm -->
  <rect x="12" y="6" width="2" height="5" fill="#ffffff"/>
  <rect x="14" y="6" width="1" height="5" fill="#333333"/>
  <rect x="12" y="11" width="2" height="1" fill="#333333"/>
  <rect x="12" y="5" width="2" height="1" fill="#333333"/>
  <!-- left leg -->
  <rect x="4" y="13" width="3" height="2" fill="#ffffff"/>
  <rect x="3" y="13" width="1" height="2" fill="#333333"/>
  <rect x="4" y="15" width="3" height="1" fill="#333333"/>
  <!-- right leg -->
  <rect x="9" y="13" width="3" height="2" fill="#ffffff"/>
  <rect x="12" y="13" width="1" height="2" fill="#333333"/>
  <rect x="9" y="15" width="3" height="1" fill="#333333"/>
  <!-- legs top join -->
  <rect x="4" y="12" width="8" height="1" fill="#444444"/>
  <!-- head -->
  <rect x="4" y="1" width="8" height="6" fill="#ffffff"/>
  <!-- head outline -->
  <rect x="3" y="1" width="1" height="6" fill="#333333"/>
  <rect x="12" y="1" width="1" height="6" fill="#333333"/>
  <rect x="4" y="0" width="8" height="1" fill="#333333"/>
  <rect x="4" y="5" width="8" height="1" fill="#444444"/>
  <!-- head top highlight -->
  <rect x="5" y="1" width="6" height="1" fill="#eeeeee"/>
  <!-- eyes (facing down = top-down) -->
  <rect x="5" y="3" width="2" height="1" fill="#333333"/>
  <rect x="9" y="3" width="2" height="1" fill="#333333"/>
</svg>
