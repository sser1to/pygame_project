<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- base chunk -->
  <rect x="4" y="10" width="40" height="30" fill="#7a7a7a"/>
  <!-- top face -->
  <rect x="4" y="10" width="40" height="7" fill="#909090"/>
  <!-- left face -->
  <rect x="4" y="10" width="8" height="30" fill="#858585"/>
  <!-- right face -->
  <rect x="36" y="10" width="8" height="30" fill="#636363"/>
  <!-- bottom face -->
  <rect x="4" y="36" width="40" height="4" fill="#5a5a5a"/>
  <!-- irregular top edge bumps -->
  <rect x="4" y="6" width="10" height="8" fill="#7a7a7a"/>
  <rect x="4" y="6" width="10" height="3" fill="#909090"/>
  <rect x="18" y="4" width="14" height="8" fill="#7a7a7a"/>
  <rect x="18" y="4" width="14" height="3" fill="#909090"/>
  <rect x="34" y="8" width="10" height="7" fill="#7a7a7a"/>
  <rect x="34" y="8" width="10" height="3" fill="#909090"/>
  <!-- chip left bottom -->
  <rect x="4" y="32" width="6" height="8" fill="#7a7a7a"/>
  <rect x="4" y="32" width="2" height="8" fill="#858585"/>
  <!-- highlight streaks on top -->
  <rect x="8" y="10" width="6" height="2" fill="#aaaaaa"/>
  <rect x="20" y="7" width="8" height="2" fill="#aaaaaa"/>
  <rect x="36" y="9" width="4" height="2" fill="#999999"/>
  <!-- crack 1 -->
  <rect x="14" y="14" width="2" height="10" fill="#5a5a5a"/>
  <rect x="14" y="20" width="6" height="2" fill="#5a5a5a"/>
  <rect x="20" y="18" width="2" height="6" fill="#5a5a5a"/>
  <!-- crack 2 -->
  <rect x="28" y="12" width="2" height="8" fill="#5a5a5a"/>
  <rect x="28" y="18" width="5" height="2" fill="#5a5a5a"/>
  <!-- surface texture dents -->
  <rect x="8" y="18" width="3" height="3" fill="#6a6a6a"/>
  <rect x="9" y="19" width="2" height="2" fill="#636363"/>
  <rect x="32" y="24" width="3" height="3" fill="#6a6a6a"/>
  <rect x="33" y="25" width="2" height="2" fill="#636363"/>
  <rect x="22" y="28" width="4" height="3" fill="#6a6a6a"/>
  <rect x="23" y="29" width="2" height="2" fill="#636363"/>
  <!-- small glint -->
  <rect x="20" y="12" width="2" height="2" fill="#bbbbbb"/>
  <rect x="34" y="16" width="2" height="2" fill="#aaaaaa"/>
</svg>
