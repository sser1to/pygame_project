<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- dark outline / shadow base -->
  <rect x="4" y="4" width="40" height="40" fill="#1a0000"/>
  <rect x="6" y="2" width="36" height="44" fill="#1a0000"/>
  <rect x="2" y="6" width="44" height="36" fill="#1a0000"/>

  <!-- main head fill -->
  <rect x="5" y="5" width="38" height="38" fill="#cc1111"/>
  <rect x="7" y="3" width="34" height="42" fill="#cc1111"/>
  <rect x="3" y="7" width="42" height="34" fill="#cc1111"/>

  <!-- darker red sides (volume) -->
  <rect x="3" y="7" width="5" height="34" fill="#aa0a0a"/>
  <rect x="40" y="7" width="5" height="34" fill="#880808"/>
  <rect x="7" y="40" width="34" height="5" fill="#990909"/>

  <!-- top highlight -->
  <rect x="8" y="4" width="32" height="4" fill="#ee2222"/>
  <rect x="10" y="5" width="28" height="2" fill="#ff3333"/>

  <!-- bumps / horns top -->
  <rect x="8" y="2" width="6" height="4" fill="#bb0f0f"/>
  <rect x="9" y="0" width="4" height="4" fill="#cc1111"/>
  <rect x="10" y="0" width="2" height="2" fill="#dd2020"/>

  <rect x="34" y="2" width="6" height="4" fill="#bb0f0f"/>
  <rect x="35" y="0" width="4" height="4" fill="#cc1111"/>
  <rect x="36" y="0" width="2" height="2" fill="#dd2020"/>

  <!-- small side spikes -->
  <rect x="0" y="14" width="4" height="4" fill="#bb0f0f"/>
  <rect x="0" y="16" width="2" height="2" fill="#dd2020"/>
  <rect x="0" y="28" width="4" height="4" fill="#bb0f0f"/>
  <rect x="0" y="30" width="2" height="2" fill="#dd2020"/>
  <rect x="44" y="14" width="4" height="4" fill="#990808"/>
  <rect x="46" y="16" width="2" height="2" fill="#bb0f0f"/>
  <rect x="44" y="28" width="4" height="4" fill="#990808"/>
  <rect x="46" y="30" width="2" height="2" fill="#bb0f0f"/>

  <!-- LEFT EYE -->
  <!-- eye socket -->
  <rect x="8" y="13" width="14" height="12" fill="#0a0000"/>
  <!-- eyeball -->
  <rect x="9" y="14" width="12" height="10" fill="#111111"/>
  <!-- pupil deep black -->
  <rect x="11" y="15" width="8" height="8" fill="#000000"/>
  <!-- iris dark ring -->
  <rect x="10" y="16" width="10" height="6" fill="#0a0a0a"/>
  <rect x="11" y="15" width="8" height="8" fill="#000000"/>
  <!-- tiny red inner glow -->
  <rect x="13" y="17" width="4" height="4" fill="#330000"/>
  <rect x="14" y="18" width="2" height="2" fill="#550000"/>
  <!-- white glint -->
  <rect x="10" y="15" width="2" height="2" fill="#ffffff"/>

  <!-- RIGHT EYE -->
  <rect x="26" y="13" width="14" height="12" fill="#0a0000"/>
  <rect x="27" y="14" width="12" height="10" fill="#111111"/>
  <rect x="29" y="15" width="8" height="8" fill="#000000"/>
  <rect x="28" y="16" width="10" height="6" fill="#0a0a0a"/>
  <rect x="29" y="15" width="8" height="8" fill="#000000"/>
  <rect x="31" y="17" width="4" height="4" fill="#330000"/>
  <rect x="32" y="18" width="2" height="2" fill="#550000"/>
  <rect x="28" y="15" width="2" height="2" fill="#ffffff"/>

  <!-- NOSE (flat nostrils top-down) -->
  <rect x="20" y="26" width="8" height="4" fill="#aa0808"/>
  <rect x="20" y="26" width="3" height="4" fill="#220000"/>
  <rect x="25" y="26" width="3" height="4" fill="#220000"/>
  <rect x="23" y="27" width="2" height="2" fill="#991010"/>

  <!-- MOUTH / maw -->
  <rect x="8" y="33" width="32" height="8" fill="#110000"/>
  <!-- teeth top row -->
  <rect x="9" y="33" width="4" height="4" fill="#ddddcc"/>
  <rect x="15" y="33" width="4" height="3" fill="#ddddcc"/>
  <rect x="21" y="33" width="4" height="5" fill="#ccccbb"/>
  <rect x="27" y="33" width="4" height="3" fill="#ddddcc"/>
  <rect x="33" y="33" width="4" height="4" fill="#ddddcc"/>
  <!-- teeth gaps -->
  <rect x="13" y="33" width="2" height="2" fill="#220000"/>
  <rect x="19" y="33" width="2" height="2" fill="#220000"/>
  <rect x="25" y="33" width="2" height="2" fill="#220000"/>
  <rect x="31" y="33" width="2" height="2" fill="#220000"/>
  <!-- gum red -->
  <rect x="8" y="37" width="32" height="2" fill="#880000"/>
  <!-- drool drops -->
  <rect x="13" y="39" width="2" height="4" fill="#cc2222" opacity="0.7"/>
  <rect x="13" y="42" width="2" height="2" fill="#ff3333" opacity="0.5"/>
  <rect x="30" y="39" width="2" height="3" fill="#cc2222" opacity="0.7"/>
  <rect x="30" y="41" width="2" height="2" fill="#ff3333" opacity="0.5"/>

  <!-- forehead scar -->
  <rect x="19" y="7" width="2" height="6" fill="#aa0808"/>
  <rect x="20" y="9" width="4" height="2" fill="#aa0808"/>
  <rect x="22" y="7" width="2" height="4" fill="#aa0808"/>

  <!-- skin texture bumps -->
  <rect x="6" y="9" width="2" height="2" fill="#bb1010"/>
  <rect x="40" y="10" width="2" height="2" fill="#991010"/>
  <rect x="38" y="30" width="2" height="2" fill="#991010"/>
  <rect x="7" y="30" width="2" height="2" fill="#bb1010"/>
</svg>
